version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      codeql:
        patterns:
          - "github/codeql-action*"

  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/.github/workflows/requirements"
    schedule:
      interval: "weekly"
