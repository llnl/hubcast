name: Linting & Style Checks
on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '.github/workflows/requirements/style.txt'

      - name: Install system dependencies for LDAP
        run: |
          sudo apt-get update
          sudo apt-get install -y libldap2-dev libsasl2-dev libssl-dev

      - name: Install Python dependencies
        run: |
          pip install -r .github/workflows/requirements/style.txt
          pip install -e .[ldap,dev]

      - name: Run Ruff
        run: |
          ruff check
          ruff format --check

      - name: Run Type Checker
        run: ty check

      - name: Run Typos
        run: typos
