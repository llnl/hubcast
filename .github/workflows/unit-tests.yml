name: Unit Tests
on:
  workflow_call:

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            'pyproject.toml'
            '.github/workflows/requirements/unit-tests.txt'

      - name: install python-ldap build dependencies
        # https://www.python-ldap.org/en/latest/installing.html#build-prerequisites
        # there are no wheels available, must build from source
        # https://docs.github.com/en/actions/reference/runners/github-hosted-runners#administrative-privileges
        # sudo apt-get update
        run: |
          sudo apt-get install -y build-essential ldap-utils libldap2-dev libsasl2-dev

      - name: Install Python dependencies
        run: |
          pip install .
          pip install -r .github/workflows/requirements/unit-tests.txt

      - name: Run Unit Tests with Pytest
        run: |
          python3 -m build  # build package for compatibility with publish.yml
          python3 -m pytest
