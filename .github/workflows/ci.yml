name: ci
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{github.ref}}-${{github.event.pull_request.number || github.run_number}}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      style: ${{ steps.filter.outputs.style }}
      security: ${{ steps.filter.outputs.security }}
      unit-tests: ${{ steps.filter.outputs.unit-tests }}
      container: ${{ steps.filter.outputs.container }}
      helm: ${{ steps.filter.outputs.helm }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # @v2
        if: ${{ github.event_name == 'push' }}
        with:
          fetch-depth: 0

        # For pull requests it's not necessary to checkout the code
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706
        id: filter
        with:
          filters: |
            style:
              - '.github/**/*'
              - 'src/**/*'
              - 'tests/**/*'
              - 'pyproject.toml'
            security:
              - '.github/**/*'
              - 'src/**/*'
              - 'pyproject.toml'
              - '.bandit'
            container:
              - '.github/**/*'
              - 'src/**/*'
              - 'pyproject.toml'
              - 'Dockerfile'
            helm:
              - '.github/**/*'
              - 'helm/**/*'
            unit-tests:
              - '.github/**/*'
              - 'src/**/*'
              - 'tests/**/*'
              - 'pyproject.toml'

  style:
    if: needs.changes.outputs.style == 'true'
    needs: changes
    uses: ./.github/workflows/style.yml

  style-helm:
    if: needs.changes.outputs.helm == 'true'
    needs: changes
    uses: ./.github/workflows/helm-style.yml

  security:
    if: needs.changes.outputs.security == 'true'
    needs: [changes, style]
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write

  unit-tests:
    if: needs.changes.outputs.unit-tests == 'true'
    needs: [changes, style]
    uses: ./.github/workflows/unit-tests.yml
    permissions:
      contents: read

  coverage:
    if: needs.changes.outputs.unit-tests == 'true'
    needs: [changes, style, unit-tests]
    uses: ./.github/workflows/coverage.yml

  container:
    if: always() && needs.changes.outputs.container == 'true'
    needs: [changes, style, security]
    uses: ./.github/workflows/container.yml
    permissions:
      contents: read
      packages: write

  all:
    needs:
     - changes
     - style
     - style-helm
     - security
     - unit-tests
     - coverage
     - container
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Status summary
      run: |
        if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
          echo "One or more required jobs failed or were cancelled"
          exit 1
        else
          echo "All jobs completed successfully"
        fi
