[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "hubcast"
version = "0.0.1"
dependencies = [
    "aiohttp",
    "aiojobs",
    "cachetools",
    "gidgethub",
    "gidgetlab",
    "pydantic",
    "pydantic-settings",
    "pyjwt",
    "repligit[aiohttp]",
    "pyyaml",
]
authors = [
    { name = "Alec Scott" },
]
description = "An event driven synchronization application for bridging GitHub and GitLab."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "Apache-2.0"
keywords = ["github", "gitlab", "mirroring", "ci"]

[project.urls]
Homepage = "https://github.com/llnl/hubcast"
Issues = "https://github.com/llnl/hubcast/issues"

[project.optional-dependencies]
# https://www.python-ldap.org/en/latest/installing.html#build-prerequisites
ldap = [
    "python-ldap"
]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "ruff",
    "ty",
    "typos"
]

[tool.pytest.ini_options]
pythonpath = [
  "src"
]

[tool.ruff]
line-length = 88
exclude = ["spack"]

[tool.ty.src]
# exclude spack directory from type checking
exclude = ["spack/**"]

# python-ldap is a C extension without type stubs
[[tool.ty.overrides]]
include = ["src/hubcast/account_map/ldap.py", "tests/test_account_map.py"]
rules = { unresolved-attribute = "ignore" }

[tool.bandit]
exclude_dirs = []
