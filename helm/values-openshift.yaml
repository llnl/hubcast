# OpenShift-specific values for Hubcast
# This file contains only the values that differ from the defaults in values.yaml
# Usage: helm install hubcast . -f values-openshift.yaml

# OpenShift assigns UIDs dynamically, so don't set a specific user
podSecurityContext:
  runAsNonRoot: true
  runAsUser: null

# Use OpenShift Route instead of Kubernetes Ingress
ingress:
  enabled: false

route:
  enabled: true
  # Each hostname gets its own Route object pointing to the same Service.
  hosts:
    - hubcast.apps.your-openshift-cluster.com
    # - hubcast.external.domain.tld
  tls:
    enabled: true
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

# Example configuration
hubcast:
  github:
    appId: "123456"
    botUser: "/hubcast"

  gitlab:
    url: "https://gitlab.com"
    tokenType: "impersonation"
    callbackUrl: "https://hubcast.apps.your-openshift-cluster.com/v1/events/dest/gitlab"

  accountMapType: "file"
  accountMap:
    users:
      github_user1: gitlab_user1
      github_user2: gitlab_user2

# For production, create secrets externally:
# oc create secret generic hubcast-secrets \
#   --from-file=HC_GH_WEBHOOK_SECRET=github-webhook-secret.txt \
#   --from-file=HC_GH_PRIVATE_KEY=github-app.pem \
#   --from-file=HC_GL_WEBHOOK_SECRET=gitlab-webhook-secret.txt \
#   --from-file=HC_GL_TOKEN=gitlab-token.txt
#
# Note: Files used with --from-file should not contain trailing newlines.
# Remove them with: echo -n "$(cat github-webhook-secret.txt)" > github-webhook-secret.txt
#
# Then reference:
# existingSecret: "hubcast-secrets"
